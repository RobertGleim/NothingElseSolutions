# Render.com Blueprint Configuration
# Deploy using: render.com/docs/infrastructure-as-code

services:
  # Backend API
  - type: web
    name: nothing-else-solutions-api
    runtime: python
    region: oregon
    plan: free
    autoDeploy: true
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_SSL
        sync: false
      - key: SMTP_TIMEOUT
        sync: false
      - key: CONTACT_WEBHOOK_URL
        sync: false
    healthCheckPath: /health

