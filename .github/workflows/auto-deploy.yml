name: Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy-vercel:
    name: Trigger Vercel Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Vercel
        run: |
          curl -X POST "${{ secrets['VERCEL_DEPLOY_HOOK_URL'] }}"

  deploy-render:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        run: |
          curl -X POST "${{ secrets['RENDER_DEPLOY_HOOK_URL'] }}"
